
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#101014">

  <title>Until We Meet 🖤</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #101014;
      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 30px 20px;
      text-align: center;
    }

    .heart {
      font-size: 35px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(32px, 8vw, 55px);
      font-weight: 700;
      letter-spacing: 3px;
      margin: 0 0 18px;
    }

    .subtitle {
      color: #9999a3;
      font-size: 13px;
      letter-spacing: 4px;
    }

    .line {
      height: 1px;
      background: #44444d;
      margin: 45px 0;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .number {
      font-size: clamp(28px, 9vw, 65px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .label {
      margin-top: 12px;
      color: #9999a3;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .city {
      font-size: 35px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .date {
      margin-top: 20px;
      color: #9999a3;
      font-size: 16px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 70px;
      color: #9999a3;
      font-size: 12px;
      letter-spacing: 2px;
      line-height: 1.8;
    }

    .finished {
      font-size: 30px;
      font-weight: 600;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="heart">🖤</div>

    <h1>UNTIL WE MEET</h1>

    <div class="subtitle">
      COUNTING EVERY MOMENT
    </div>

    <div class="line"></div>

    <div class="countdown" id="countdown">

      <div>
        <div class="number" id="days">00</div>
        <div class="label">DAYS</div>
      </div>

      <div>
        <div class="number" id="hours">00</div>
        <div class="label">HOURS</div>
      </div>

      <div>
        <div class="number" id="minutes">00</div>
        <div class="label">MINUTES</div>
      </div>

      <div>
        <div class="number" id="seconds">00</div>
        <div class="label">SECONDS</div>
      </div>

    </div>

    <div class="line"></div>

    <div class="city" id="city">YEREVAN</div>

    <div class="date">
      06 NOVEMBER 2026 / 03:30
    </div>

    <div class="footer">
      EVERY MOMENT BRINGS US CLOSER
    </div>

  </main>

  <script>
    // 06 November 2026, 03:30 in Yerevan (UTC+4)
    const meeting = new Date(
      "2026-11-06T03:30:00+04:00"
    ).getTime();

    const pad = n => String(n).padStart(2, "0");

    function updateCountdown() {
      const now = Date.now();

      let diff = Math.max(
        0,
        meeting - now
      );

      const days = Math.floor(
        diff / 86400000
      );

      diff %= 86400000;

      const hours = Math.floor(
        diff / 3600000
      );

      diff %= 3600000;

      const minutes = Math.floor(
        diff / 60000
      );

      diff %= 60000;

      const seconds = Math.floor(
        diff / 1000
      );

      document.getElementById("days")
        .textContent = pad(days);

      document.getElementById("hours")
        .textContent = pad(hours);

      document.getElementById("minutes")
        .textContent = pad(minutes);

      document.getElementById("seconds")
        .textContent = pad(seconds);

      if (now >= meeting) {
        document.getElementById("city")
          .textContent = "THE MOMENT IS HERE";
      }
    }

    updateCountdown();

    setInterval(updateCountdown, 1000);

    document.addEventListener(
      "visibilitychange",
      updateCountdown
    );
  </script>

</body>
</html>
